services:
  postgres:
    image: postgres:18
    container_name: postgres_db
    restart: unless-stopped

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin1234
      POSTGRES_DB: appdb

    volumes:
      - postgres_data:/var/lib/postgresql

    ports:
      - "5433:5432"

    networks:
      - database_network

volumes:
  postgres_data:

networks:
  database_network:
